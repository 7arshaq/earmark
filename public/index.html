<!doctype html>
<html lang="en" data-view="home">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Earmark</title>
    <meta name="description" content="Paste a video link. Keep the audio. Listen like a podcast." />
    <meta name="theme-color" content="#232323" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Earmark" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <main class="stage" id="stage">
        <section class="view view-home" id="home" aria-label="Home"></section>
      </main>
      <div class="mini-wrap" id="miniWrap">
        <div class="mini-clip"><div class="mini" id="mini"></div></div>
      </div>
      <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
    </div>

    <div class="player" id="player" role="dialog" aria-label="Player" aria-hidden="true" inert></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <audio id="audio" preload="auto" playsinline></audio>

    <noscript><p style="color:#eee;padding:24px;font-family:sans-serif">Earmark needs JavaScript.</p></noscript>
  </body>
</html>
